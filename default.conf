server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /whoami {
        resolver 127.0.0.11 valid=10s;
        set $api_service api;
        proxy_pass http://$api_service/api;
    }
}
