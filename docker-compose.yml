
services:
  frontend:
    build: .
    image: levkorr/ipr-frontend:1.0
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - ipr_net

  api:
    image: containous/whoami
    networks:
      - ipr_net

  logger:
    image: busybox:1.36
    command: >
      sh -c 'while true; do
        echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) logger alive" >> /data/log.txt;
        sleep 5;
      done'
    volumes:
      - logger_data:/data
    networks:
      - ipr_net

networks:
  ipr_net:
    driver: bridge

volumes:
  logger_data:
